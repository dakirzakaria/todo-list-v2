<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="./main.js" defer></script>
    <title>Document</title>
  </head>
  <body class="">
    <aside class="sidebar">
      <a href="#" class="logo"> ToDoList</a>
      <ul class="category-list" id="category-list">
        <li>
          <button type="button">All Tasks</button>
          <span id="all-tasks-count"></span>
        </li>
        <li>
          <button type="button">Checked Tasks</button
          ><span id="checked-tasks-count"></span>
        </li>
        <li>
          <button type="button">Favorites Task</button
          ><span id="favorites-tasks-count"></span>
        </li>
      </ul>
      <form id="category-form" class="category-form">
        <input
          type="text"
          id="category-input"
          placeholder="Add a new category"
        />
        <button
          type="submit"
          id="add-category-button"
          class="ph-bold ph-plus"
        ></button>
      </form>
    </aside>
    <br />
    <main id="main">
      <section>
        <h1 id="title"></h1>
        <form id="task-form">
          <input
            type="text"
            id="task-input"
            placeholder="Add task or search by name"
          />
          <select id="task-category">
            <option value="" selected disabled>
              Select a Category
            </option>
          </select>
          <button type="submit" id="add-task-button">Add</button>
        </form>
        <ul id="task-list"></ul>
      </section>
    </main>
  </body>
</html>
